# Depth 3 and complexity 5 (every field counts 1) reject the operations below; introspection is off; a stalled operation times out.
micronaut.graphql.tools.protection.max-depth=3
micronaut.graphql.tools.protection.max-complexity=5
micronaut.graphql.tools.protection.introspection=false
micronaut.graphql.tools.execution.timeout=500ms
