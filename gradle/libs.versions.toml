[versions]
# Build-tool inputs, not dependency pins: micronaut-build reads `micronaut` (core BOM) and `micronaut-test` for the `mn` and
# `mnTest` catalogs, the Micronaut Gradle plugin reads `micronaut-platform`.
micronaut = "4.10.37"
micronaut-platform = "4.10.25"
micronaut-docs = "3.0.0"
micronaut-test = "4.10.3"
micronaut-graphql = "4.8.0"
# The versions that micronaut-platform 4.10.25 manages; the catalogs of these give the Micrometer, OpenTelemetry and security modules their compile-only APIs
micronaut-micrometer = "5.13.3"
micronaut-tracing = "7.2.0"
micronaut-security = "4.18.3"
micronaut-serde = "2.16.2"
micronaut-validation = "4.12.0"
micronaut-rxjava2 = "2.9.0"
micronaut-rxjava3 = "3.9.0"
micronaut-kotlin = "4.7.0"
micronaut-logging = "1.7.5"

# Override of the BOM-managed Groovy 4.0.28, which cannot read JDK 27 class files: until the Micronaut BOM catches up. Applied
# by resolutionStrategy (buildSrc convention plugin and the test-suite builds); the only override of a managed version.
groovy = "4.0.33"

# Not managed by the Micronaut BOMs or catalogs
# test scope of the client module: Mono and Flux conversion. Its version catalog is not imported, because a catalog is fetched by every job at settings time
micronaut-reactor = "3.9.1"
apollo = "5.2.0"
# Apollo Kotlin 5 moved its Java API (client and RxJava 3 support) to a separate project; apollo-rx3-support has no 5.x release
apollo-java = "1.0.0"
jmh = "1.37"
jetbrains-annotations = "26.1.0"
# architecture rules (ArchitectureRulesSpec); the Micronaut catalogs do not manage it
archunit = "1.5.1"
# The Maven plugin (#195): the Maven line it is compiled against and supports (3.9.x; a plugin built against 3.9.11 runs on any later 3.9
# and on Maven 4), the annotations of the mojo, and the testing harness that binds a <configuration> to the mojo
maven = "3.9.11"
maven-plugin-annotations = "3.15.2"
maven-plugin-testing-harness = "3.4.0"

# test oracle for the scalar SPI: the date/time scalars many graphql-java applications use
graphql-java-datetime = "6.0.0"

# test scope only; the default leg uses it as is (the line of the managed graphql-java 22.4), build.gradle.kts moves it with
# the floor and ceiling legs
graphql-java-extended-validation = "22.0"

# graphql-java legs, selected with -PgraphqlJavaLeg, see build.gradle.kts. The default leg pins nothing: graphql-java
# is whatever micronaut-graphql manages (22.4 for 4.8.0), the libraries above go with it. `latest` resolves the newest release
# of each library, see build.gradle.kts (the canary only).
# floor: the oldest supported line
floor-graphql-java = "21.5"
floor-extended-scalars = "21.0"
floor-java-dataloader = "3.2.2"
floor-extended-validation = "21.0"
# ceiling: the newest tested line. graphql-java-extended-scalars has no 25.x or 26.x release; 24.1 links against 26.2.
# extended-validation 21.0 calls a GraphQLCodeRegistry overload that 25.x removed; 24.0 does not.
ceiling-graphql-java = "26.2"
ceiling-extended-scalars = "24.1"
ceiling-java-dataloader = "6.0.0"
ceiling-extended-validation = "24.0"

[libraries]
jmh-core = { module = "org.openjdk.jmh:jmh-core", version.ref = "jmh" }
jmh-generator-annprocess = { module = "org.openjdk.jmh:jmh-generator-annprocess", version.ref = "jmh" }
# Micronaut BOMs: the versions above are build-tool inputs; the platform BOM also manages logback and JUnit for the library
# modules' tests and the benchmarks (the core BOM behind the `mn` catalog does not)
micronaut-core = { module = "io.micronaut:micronaut-core-bom", version.ref = "micronaut" }
micronaut-platform = { module = "io.micronaut.platform:micronaut-platform", version.ref = "micronaut-platform" }
micronaut-graphql = { module = "io.micronaut.graphql:micronaut-graphql-bom", version.ref = "micronaut-graphql" }
micronaut-micrometer = { module = "io.micronaut.micrometer:micronaut-micrometer-bom", version.ref = "micronaut-micrometer" }
micronaut-tracing = { module = "io.micronaut.tracing:micronaut-tracing-bom", version.ref = "micronaut-tracing" }
micronaut-security = { module = "io.micronaut.security:micronaut-security-bom", version.ref = "micronaut-security" }
micronaut-serde = { module = "io.micronaut.serde:micronaut-serde-bom", version.ref = "micronaut-serde" }
micronaut-validation = { module = "io.micronaut.validation:micronaut-validation-bom", version.ref = "micronaut-validation" }
micronaut-rxjava2 = { module = "io.micronaut.rxjava2:micronaut-rxjava2-bom", version.ref = "micronaut-rxjava2" }
micronaut-rxjava3 = { module = "io.micronaut.rxjava3:micronaut-rxjava3-bom", version.ref = "micronaut-rxjava3" }
micronaut-kotlin = { module = "io.micronaut.kotlin:micronaut-kotlin-bom", version.ref = "micronaut-kotlin" }
micronaut-logging = { module = "io.micronaut.logging:micronaut-logging-bom", version.ref = "micronaut-logging" }

graphql-java-extended-validation = { module = "com.graphql-java:graphql-java-extended-validation", version.ref = "graphql-java-extended-validation" }

apollo-java-client = { module = "com.apollographql.java:client", version.ref = "apollo-java" }
apollo-java-rx3 = { module = "com.apollographql.java:rx3", version.ref = "apollo-java" }
apollo-api = { module = "com.apollographql.apollo:apollo-api", version.ref = "apollo" }
archunit = { module = "com.tngtech.archunit:archunit", version.ref = "archunit" }
jetbrains-annotations = { module = "org.jetbrains:annotations", version.ref = "jetbrains-annotations" }
micronaut-reactor = { module = "io.micronaut.reactor:micronaut-reactor", version.ref = "micronaut-reactor" }
graphql-java-datetime = { module = "com.tailrocks.graphql:graphql-java-datetime", version.ref = "graphql-java-datetime" }
maven-plugin-api = { module = "org.apache.maven:maven-plugin-api", version.ref = "maven" }
maven-core = { module = "org.apache.maven:maven-core", version.ref = "maven" }
maven-compat = { module = "org.apache.maven:maven-compat", version.ref = "maven" }
maven-plugin-annotations = { module = "org.apache.maven.plugin-tools:maven-plugin-annotations", version.ref = "maven-plugin-annotations" }
maven-plugin-testing-harness = { module = "org.apache.maven.plugin-testing:maven-plugin-testing-harness", version.ref = "maven-plugin-testing-harness" }
