[versions]
# Build-tool inputs, not dependency pins: micronaut-build reads `micronaut` (core BOM) and `micronaut-test` for the `mn` and
# `mnTest` catalogs, the Micronaut Gradle plugin reads `micronaut-platform`. D-34, D-41.
micronaut = "4.10.37"
micronaut-platform = "4.10.24"
micronaut-docs = "3.0.0"
micronaut-test = "4.10.3"
micronaut-graphql = "4.8.0"

# Override of the BOM-managed Groovy 4.0.28, which cannot read JDK 27 class files: until the Micronaut BOM catches up. Applied
# by resolutionStrategy (buildSrc convention plugin and the test-suite builds); the only override of a managed version.
groovy = "4.0.33"

# Not managed by the Micronaut BOMs or catalogs
apollo = "5.2.0"
# Apollo Kotlin 5 moved its Java API (client and RxJava 3 support) to a separate project; apollo-rx3-support has no 5.x release
apollo-java = "1.0.0"
jmh = "1.37"
jetbrains-annotations = "26.1.0"
# test oracle for the scalar SPI: the date/time scalars many graphql-java applications use
graphql-java-datetime = "6.0.0"

# test scope only; the default leg uses it as is (the line of the managed graphql-java 22.4), build.gradle.kts moves it with
# the floor and ceiling legs
graphql-java-extended-validation = "22.0"

# graphql-java legs (D-35), selected with -PgraphqlJavaLeg, see build.gradle.kts. The default leg pins nothing: graphql-java
# is whatever micronaut-graphql manages (22.4 for 4.8.0), the libraries above go with it. `latest` resolves the newest release
# of each library, see build.gradle.kts (the canary only).
# floor: the oldest supported line
floor-graphql-java = "21.5"
floor-extended-scalars = "21.0"
floor-java-dataloader = "3.2.2"
floor-extended-validation = "21.0"
# ceiling: the newest tested line. graphql-java-extended-scalars has no 25.x or 26.x release; 24.0 links against 26.2.
# extended-validation 21.0 calls a GraphQLCodeRegistry overload that 25.x removed; 24.0 does not.
ceiling-graphql-java = "26.2"
ceiling-extended-scalars = "24.0"
ceiling-java-dataloader = "6.0.0"
ceiling-extended-validation = "24.0"

[libraries]
jmh-core = { module = "org.openjdk.jmh:jmh-core", version.ref = "jmh" }
jmh-generator-annprocess = { module = "org.openjdk.jmh:jmh-generator-annprocess", version.ref = "jmh" }
# Micronaut BOMs: the versions above are build-tool inputs; the platform BOM also manages logback and JUnit for the library
# modules' tests and the benchmarks (the core BOM behind the `mn` catalog does not)
micronaut-core = { module = "io.micronaut:micronaut-core-bom", version.ref = "micronaut" }
micronaut-platform = { module = "io.micronaut.platform:micronaut-platform", version.ref = "micronaut-platform" }
micronaut-graphql = { module = "io.micronaut.graphql:micronaut-graphql-bom", version.ref = "micronaut-graphql" }

graphql-java-extended-validation = { module = "com.graphql-java:graphql-java-extended-validation", version.ref = "graphql-java-extended-validation" }

apollo-java-client = { module = "com.apollographql.java:client", version.ref = "apollo-java" }
apollo-java-rx3 = { module = "com.apollographql.java:rx3", version.ref = "apollo-java" }
apollo-api = { module = "com.apollographql.apollo:apollo-api", version.ref = "apollo" }
jetbrains-annotations = { module = "org.jetbrains:annotations", version.ref = "jetbrains-annotations" }
graphql-java-datetime = { module = "com.tailrocks.graphql:graphql-java-datetime", version.ref = "graphql-java-datetime" }
