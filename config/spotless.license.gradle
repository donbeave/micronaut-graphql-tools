// The micronaut-build quality plugins check license headers of the library's src/main only. The suites and the benchmarks
// apply none of them, so each applies this script to check its own headers. It adds no formatting rules.
apply plugin: 'com.diffplug.spotless'

spotless {
    def header = rootProject.file('config/spotless.license.java')
    java {
        target 'src/*/java/**/*.java'
        licenseHeaderFile header
    }
    groovy {
        target 'src/*/groovy/**/*.groovy'
        licenseHeaderFile header
    }
    kotlin {
        target 'src/*/kotlin/**/*.kt'
        licenseHeaderFile header
    }
}
