projectVersion=1.0.0-SNAPSHOT
projectGroup=io.micronaut.graphql.tools

title=Micronaut GraphQL Tools
projectDesc=Schema-first approach for building GraphQL applications with Micronaut
projectUrl=https://github.com/donbeave/micronaut-graphql-tools
githubSlug=donbeave/micronaut-graphql-tools
developers=Alexey Zhokhov

org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
# The configuration cache stays off: `./gradlew build` cannot store it with micronaut-build 7.6.6 (the BOM's
# checkVersionCatalogCompatibility and generatePomFileForMavenPublication tasks are not serializable) and the Spotless tasks
# are incompatible (verified on Gradle 9.9.1).
org.gradle.configuration-cache=false
org.gradle.configuration-cache.parallel=false
org.gradle.caching=true
org.gradle.parallel=true
