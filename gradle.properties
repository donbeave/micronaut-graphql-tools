projectVersion=1.0.0-SNAPSHOT
projectGroup=io.micronaut.graphql.tools

title=Micronaut GraphQL Tools
projectDesc=Schema-first approach for building GraphQL applications with Micronaut
projectUrl=https://github.com/donbeave/micronaut-graphql-tools
githubSlug=donbeave/micronaut-graphql-tools
developers=Alexey Zhokhov

org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
# The configuration cache stays off: `./gradlew build` cannot store it with micronaut-build 7.6.6 (the BOM's
# checkVersionCatalogCompatibility and generatePomFileForMavenPublication tasks are not serializable) and the Spotless tasks
# are incompatible (verified on Gradle 9.9.1).
org.gradle.configuration-cache=false
org.gradle.configuration-cache.parallel=false
org.gradle.caching=true
# An incremental KSP run drops the BeanIntrospectionReference entries of introspections that @Introspected(packages or classes) generates
# for classes of another module, while the generated classes stay, and the build cache can then restore that incomplete output (#566).
# KSP always reprocesses in full: `ksp.incremental=false`. test-suite-kotlin's IntrospectionEntriesTest guards the result.
ksp.incremental=false
org.gradle.parallel=true
# Gradle retries a transient download failure (HTTP 408 or 429, a reset connection) a few times, but within a fraction of a second,
# which does not outlast a rate limit: retry more often with a longer wait, and give slow repositories more time. The
# .github/scripts/retry-on-download-failure.sh wrapper reruns CI steps that still fail on a download.
systemProp.org.gradle.internal.repository.max.tentatives=5
systemProp.org.gradle.internal.repository.initial.backoff=2000
systemProp.org.gradle.internal.http.connectionTimeout=180000
systemProp.org.gradle.internal.http.socketTimeout=180000
