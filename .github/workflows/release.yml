name: Release
# Publishes a milestone (1.0.0-M<n>) or the final 1.0.0 to the GitHub Packages Maven registry of this repository.
# Nothing else is published: no Maven Central, no GitHub Release, no snapshots.
#
# Triggers: a pushed version tag, or a manual run with the tag to publish (this is how a tag that predates this workflow
# is published). The workflow definition and the publishing setup (.github/gradle/publish-github-packages.init.gradle)
# always come from the ref that runs the workflow; the sources that are built and published are always the tag's tree.
# It never runs on a release or a pull request.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish, for example 1.0.0-M1'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  # One publish per tag at a time; a queued run waits and is never cancelled halfway through an upload.
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  # The full build of the tagged commit, exactly as the default leg of gradle.yml runs it, plus the version check.
  verify:
    name: verify
    if: github.repository == 'donbeave/micronaut-graphql-tools'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MISE_ENV: jdk25
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - name: Resolve and validate the tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            # A manual run must use the workflow definition on master: another branch could change what is published.
            if [ "$REF" != "refs/heads/master" ]; then
              echo "::error::Run this workflow from master (--ref master), not from $REF." >&2
              exit 1
            fi
            tag="$INPUT_TAG"
          else
            tag="$REF_NAME"
          fi
          if ! printf '%s' "$tag" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-M[0-9]+)?$'; then
            echo "::error::Tag '$tag' is not a milestone or release version (1.0.0-M<n> or 1.0.0); nothing is published." >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      # The workflow's own files (composite action, mise.toml, init script) come from the ref that runs the workflow.
      - name: Check out the workflow definition
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out the tagged sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Record the verified commit
        id: sha
        working-directory: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Require the tagged commit to be on master
        working-directory: source
        run: |
          set -euo pipefail
          git fetch --no-tags origin master:refs/remotes/origin/master
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/master; then
            echo "::error::The commit of tag ${STEPS_TAG} is not on master; nothing is published." >&2
            exit 1
          fi
        env:
          STEPS_TAG: ${{ steps.tag.outputs.tag }}
      # mise only, with no cache: the composite setup-build action restores caches, and nothing restored may end up in a published artifact.
      - name: Install the JDK with mise
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          install: true
          install_args: java
          cache: false
      - name: Build with Gradle
        working-directory: source
        run: |
          "$GITHUB_WORKSPACE/.github/scripts/retry-on-download-failure.sh" ./gradlew build --no-daemon --continue -PgraphqlJavaLeg=default -PprojectVersion="$TAG"
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          PREDICTIVE_TEST_SELECTION: 'false'
      - name: Assert the build version equals the tag
        working-directory: source
        run: |
          set -euo pipefail
          for project in micronaut-graphql-tools micronaut-graphql-tools-bom; do
            actual=$(./gradlew --no-daemon -q ":${project}:properties" -PprojectVersion="$TAG" | sed -n 's/^version: //p')
            echo "${project}: ${actual}"
            if [ "$actual" != "$TAG" ]; then
              echo "::error::The build version of ${project} is '${actual}', the tag is '${TAG}'." >&2
              exit 1
            fi
          done
        env:
          TAG: ${{ steps.tag.outputs.tag }}
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-test-reports
          path: |
            source/**/build/test-results/test/TEST-*.xml
            source/**/build/reports/tests/test/
          if-no-files-found: ignore
          retention-days: 7

  # Publishes only after verify is green. This is the only job with write access to packages.
  publish:
    name: publish to GitHub Packages
    needs: verify
    if: github.repository == 'donbeave/micronaut-graphql-tools'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MISE_ENV: jdk25
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the workflow definition
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out the tagged sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit that verify built and checked, not the tag again: a tag moved after verify cannot change what is published.
          ref: ${{ needs.verify.outputs.sha }}
          path: source
          persist-credentials: false
      # mise only, with no cache: the composite setup-build action restores caches, and nothing restored may end up in a published artifact.
      - name: Install the JDK with mise
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          install: true
          install_args: java
          cache: false
      - name: Publish
        working-directory: source
        run: |
          set -euo pipefail
          if ! printf '%s' "$TAG" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-M[0-9]+)?$'; then
            echo "::error::Refusing to publish '$TAG': not a milestone or release version." >&2
            exit 1
          fi
          ./gradlew publishAllPublicationsToGitHubPackagesRepository --no-daemon \
            -PgraphqlJavaLeg=default -PprojectVersion="$TAG" \
            -I "$GITHUB_WORKSPACE/.github/gradle/publish-github-packages.init.gradle"
        env:
          TAG: ${{ needs.verify.outputs.tag }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Summary
        env:
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          {
            echo "### Published ${TAG} to GitHub Packages"
            echo
            echo "Registry: https://maven.pkg.github.com/donbeave/micronaut-graphql-tools"
            echo
            echo "- io.micronaut.graphql.tools:micronaut-graphql-tools:${TAG}"
            echo "- io.micronaut.graphql.tools:micronaut-graphql-tools-processor:${TAG}"
            echo "- io.micronaut.graphql.tools:micronaut-graphql-tools-binding:${TAG}"
            echo "- io.micronaut.graphql.tools:micronaut-graphql-tools-scalars:${TAG}"
            echo "- io.micronaut.graphql.tools:micronaut-graphql-tools-micrometer:${TAG}"
            echo "- io.micronaut.graphql.tools:micronaut-graphql-tools-opentelemetry:${TAG}"
            echo "- io.micronaut.graphql.tools:micronaut-graphql-tools-upload:${TAG}"
            echo "- io.micronaut.graphql.tools:micronaut-graphql-tools-security:${TAG}"
            echo "- io.micronaut.graphql.tools:micronaut-graphql-tools-bom:${TAG}"
          } >> "$GITHUB_STEP_SUMMARY"
