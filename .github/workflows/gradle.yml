name: Java CI
on:
  push:
    branches:
      - master
      - '[1-9]+.[0-9]+.x'
  pull_request:
    # `edited` re-runs the gate when the title or body changes, so the consumer-name guard sees the new text.
    types: [opened, synchronize, reopened, edited]
    branches:
      - master
      - '[1-9]+.[0-9]+.x'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # graphql-java legs by role (floor, default, ceiling, latest): the versions live in gradle/libs.versions.toml, never here.
  # The graphql-java axis runs on JDK 25; JDK 21 runs the default leg only. Job names are role-based, so a version
  # bump never renames a job. Every gated job is listed in the `needs:` of `required checks` below.
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - java: '25'
            graphql-java: floor
          - java: '25'
            graphql-java: default
          - java: '25'
            graphql-java: ceiling
          - java: '21'
            graphql-java: default
    name: build (Java ${{ matrix.java }}, graphql-java ${{ matrix.graphql-java }})
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-build
        with:
          jdk: ${{ matrix.java }}
          tools: java
      - name: Build with Gradle
        run: ./gradlew build --no-daemon --continue -PgraphqlJavaLeg=${{ matrix.graphql-java }}
        env:
          # Optional: build scans and remote cache when the secrets exist; the build passes without them (forks).
          GRADLE_ENTERPRISE_ACCESS_KEY: ${{ secrets.GRADLE_ENTERPRISE_ACCESS_KEY }}
          GRADLE_ENTERPRISE_CACHE_USERNAME: ${{ secrets.GRADLE_ENTERPRISE_CACHE_USERNAME }}
          GRADLE_ENTERPRISE_CACHE_PASSWORD: ${{ secrets.GRADLE_ENTERPRISE_CACHE_PASSWORD }}
          PREDICTIVE_TEST_SELECTION: 'false'
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-java${{ matrix.java }}-graphql-java-${{ matrix.graphql-java }}
          path: |
            **/build/test-results/test/TEST-*.xml
            **/build/reports/tests/test/
          if-no-files-found: ignore
          retention-days: 7

  check-library:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17']
        # the default graphql-java leg only
        graphql-java: [default]
    # The library modules (graphql-tools, graphql-tools-binding) compile to release 17 (see buildSrc); the test-suite-* modules
    # need Java 21 and cannot run here.
    name: check library (Java ${{ matrix.java }}, graphql-java ${{ matrix.graphql-java }})
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-build
        with:
          jdk: ${{ matrix.java }}
          tools: java
      - name: Build with Gradle
        run: ./gradlew :micronaut-graphql-tools:check :micronaut-graphql-tools-binding:check --no-daemon --continue -PgraphqlJavaLeg=${{ matrix.graphql-java }}
        env:
          # Optional: build scans and remote cache when the secrets exist; the build passes without them (forks).
          GRADLE_ENTERPRISE_ACCESS_KEY: ${{ secrets.GRADLE_ENTERPRISE_ACCESS_KEY }}
          GRADLE_ENTERPRISE_CACHE_USERNAME: ${{ secrets.GRADLE_ENTERPRISE_CACHE_USERNAME }}
          GRADLE_ENTERPRISE_CACHE_PASSWORD: ${{ secrets.GRADLE_ENTERPRISE_CACHE_PASSWORD }}
          PREDICTIVE_TEST_SELECTION: 'false'
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-java${{ matrix.java }}-graphql-java-${{ matrix.graphql-java }}
          path: |
            **/build/test-results/test/TEST-*.xml
            **/build/reports/tests/test/
          if-no-files-found: ignore
          retention-days: 7

  # Main code is compiled on the default leg and tested on the ceiling: the published jar is compiled against what
  # micronaut-graphql manages, so a graphql-java change that breaks its binary linkage (a changed return type, a removed
  # method) fails here as NoSuchMethodError, which a build that recompiles main on the ceiling would not show.
  binary-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['25']
    name: binary compatibility (Java ${{ matrix.java }}, graphql-java ceiling)
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-build
        with:
          jdk: ${{ matrix.java }}
          tools: java
      - name: Build with Gradle
        run: ./gradlew build --no-daemon --continue -PgraphqlJavaLeg=ceiling -PgraphqlJavaCompileLeg=default
        env:
          # Optional: build scans and remote cache when the secrets exist; the build passes without them (forks).
          GRADLE_ENTERPRISE_ACCESS_KEY: ${{ secrets.GRADLE_ENTERPRISE_ACCESS_KEY }}
          GRADLE_ENTERPRISE_CACHE_USERNAME: ${{ secrets.GRADLE_ENTERPRISE_CACHE_USERNAME }}
          GRADLE_ENTERPRISE_CACHE_PASSWORD: ${{ secrets.GRADLE_ENTERPRISE_CACHE_PASSWORD }}
          PREDICTIVE_TEST_SELECTION: 'false'
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-binary-compatibility
          path: |
            **/build/test-results/test/TEST-*.xml
            **/build/reports/tests/test/
          if-no-files-found: ignore
          retention-days: 7

  # The build wiring of the compile-time checks: sample projects that apply the processor with the documented
  # snippets, built by Gradle TestKit (and Maven) against the library published to build/repo. The job needs the network (plugin portal,
  # Maven Central); the graphql-java legs do not change what it proves, so it runs on the default leg only.
  build-tools:
    runs-on: ubuntu-latest
    name: build tools (Java 25, graphql-java default)
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-build
        with:
          jdk: '25'
          tools: java maven
      - name: Build the samples
        run: ./gradlew :test-suite-build:buildToolsTest --no-daemon -PgraphqlJavaLeg=default
        env:
          PREDICTIVE_TEST_SELECTION: 'false'
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-build-tools
          path: |
            test-suite-build/build/test-results/buildToolsTest/TEST-*.xml
            test-suite-build/build/reports/tests/buildToolsTest/
            test-suite-build/build/reports/build-tools/
          if-no-files-found: ignore
          retention-days: 7

  # Native image tests on Oracle GraalVM from mise.toml (it provides native-image). Not in the gate's `needs:` until #152.
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        graalvm: ['25']
        # graphql-java legs by role, see build.gradle.kts
        graphql-java: [default, ceiling]
    name: native (GraalVM ${{ matrix.graalvm }}, graphql-java ${{ matrix.graphql-java }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-build
        with:
          tools: java
      - name: Run native tests
        run: ./gradlew :test-suite-java:nativeTest :test-suite-java:nativeSerdeTest :test-suite-kotlin:nativeTest --no-daemon --no-parallel -PgraphqlJavaLeg=${{ matrix.graphql-java }}
        env:
          GRAALVM_QUICK_BUILD: 'true'
          PREDICTIVE_TEST_SELECTION: 'false'
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-test-reports-graalvm${{ matrix.graalvm }}-graphql-java${{ matrix.graphql-java }}
          path: |
            test-suite-*/build/test-results/test-native/TEST-*.xml
            test-suite-*/build/test-results/test-native/
            test-suite-*/build/test-results/serdeTest-native/TEST-*.xml
            test-suite-*/build/test-results/serdeTest-native/
          if-no-files-found: ignore
          retention-days: 7

  # Groovy has no native test: this builds the native executable of test-suite-groovy, starts it and asserts the
  # GraphQL responses (#276).
  native-groovy-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        graalvm: ['25']
        graphql-java: [default, ceiling]
    name: native Groovy smoke (GraalVM ${{ matrix.graalvm }}, graphql-java ${{ matrix.graphql-java }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-build
        with:
          tools: java
      - name: Run the native smoke test
        run: ./gradlew :test-suite-groovy:nativeSmokeTest --no-daemon --no-parallel -PgraphqlJavaLeg=${{ matrix.graphql-java }}
        env:
          GRAALVM_QUICK_BUILD: 'true'
          PREDICTIVE_TEST_SELECTION: 'false'

  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    name: actionlint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-build
        with:
          tools: github:jdx/jactionlint
          gradle: 'false'
      - name: Lint the workflows and composite actions
        run: jactionlint --color

  # The guide build (#57). The `snippet::` macro prints a warning and still succeeds when a snippet file or tag is missing in
  # one of the three suites, so the log is checked. The built guide is uploaded for reviewers; it is not published.
  docs:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['25']
    name: docs (Java ${{ matrix.java }})
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-build
        with:
          jdk: ${{ matrix.java }}
          tools: java
      - name: Build the guide
        run: |
          set -o pipefail
          ./gradlew docs --no-daemon 2>&1 | tee docs.log
      - name: Fail on a missing snippet
        run: |
          if grep -E 'NO FILE FOUND|not found in include file|include file not found|unexpected end tag|detected unclosed tag|mismatched end tag|unterminated .* block|Unresolved directive' docs.log; then
            echo "The guide has a missing snippet file or tag (test-suite-java, test-suite-kotlin, test-suite-groovy) or a broken block" >&2
            exit 1
          fi
      - name: Upload the guide
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: guide
          path: build/docs
          retention-days: 7
          if-no-files-found: error

  # Consumer-name guard: fails when the working tree or the PR title/body contains a forbidden consumer name. The pattern list
  # is the FORBIDDEN_NAMES secret (one fixed string per line) and is never written to the repository or to the log.
  # Fork PRs get no secrets: the job reports that it did not run and passes. Any other run without a pattern list fails.
  consumer-name-guard:
    name: consumer-name guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan for forbidden names
        env:
          FORBIDDEN_NAMES: ${{ secrets.FORBIDDEN_NAMES }}
          IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/consumer-name-guard"
          mkdir -p "$work"
          printf '%s\n' "$FORBIDDEN_NAMES" | tr -d '\r' | grep -v '^[[:space:]]*$' > "$work/patterns.txt" || true
          # Mask every pattern before anything else can print it.
          while IFS= read -r pattern; do
            echo "::add-mask::$pattern"
          done < "$work/patterns.txt"
          if [ ! -s "$work/patterns.txt" ]; then
            if [ "$IS_FORK" = "true" ]; then
              echo "::notice title=consumer-name guard::Did not run: fork pull requests do not receive repository secrets."
              exit 0
            fi
            # A missing or empty secret must not turn the guard into a no-op on repository branches.
            echo "::error title=consumer-name guard::The FORBIDDEN_NAMES secret is not set or empty, so the guard cannot run."
            exit 1
          fi
          failed=0
          # Working tree: print file and line only, never the matched text.
          set +e
          grep -rniIF -n -f "$work/patterns.txt" --exclude-dir=.git --exclude-dir=build --exclude-dir=.gradle . > "$work/tree-hits.txt"
          rc=$?
          set -e
          if [ "$rc" -gt 1 ]; then
            echo "::error title=consumer-name guard::Scan of the working tree failed (grep exit $rc)."
            exit 1
          fi
          if [ "$rc" -eq 0 ]; then
            while IFS=: read -r file line _; do
              echo "::error file=${file#./},line=$line,title=consumer-name guard::Forbidden name found (text withheld)."
            done < "$work/tree-hits.txt"
            failed=1
          fi
          # PR title and body: the text is not printed; only the fact of a match is reported.
          # Read from the event payload file, not from env: the runner prints every step env value in the log.
          jq -r '(.pull_request.title // ""), (.pull_request.body // "")' "$GITHUB_EVENT_PATH" > "$work/pr-text.txt"
          set +e
          grep -niIF -f "$work/patterns.txt" "$work/pr-text.txt" > /dev/null
          rc=$?
          set -e
          if [ "$rc" -gt 1 ]; then
            echo "::error title=consumer-name guard::Scan of the PR title and body failed (grep exit $rc)."
            exit 1
          fi
          if [ "$rc" -eq 0 ]; then
            echo "::error title=consumer-name guard::Forbidden name found in the pull request title or body (text withheld)."
            failed=1
          fi
          if [ "$failed" -ne 0 ]; then
            echo "Consumer-name violation: forbidden consumer name found (details above, text withheld)." >&2
            exit 1
          fi
          echo "consumer-name guard passed."

  # The only required status check. It runs even when a gated job fails or is cancelled,
  # and it is green only when every gated job succeeded. Add a gated job to `needs:`, never to the ruleset.
  required:
    name: required checks
    if: always()
    needs: [actionlint, build, check-library, binary-compatibility, build-tools, native-groovy-smoke, docs, consumer-name-guard]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Fail unless every gated job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          not_success=$(echo "$NEEDS" | jq -r 'to_entries[] | select(.value.result != "success") | "\(.key)=\(.value.result)"')
          if [ -n "$not_success" ]; then
            echo "Gated jobs not successful: $not_success" >&2
            exit 1
          fi
