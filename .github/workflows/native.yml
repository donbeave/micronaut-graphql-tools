name: Native Image CI
on:
  push:
    branches:
      - master
      - '[1-9]+.[0-9]+.x'
  pull_request:
    branches:
      - master
      - '[1-9]+.[0-9]+.x'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        graalvm: ['25']
        # graphql-java legs by role, see build.gradle.kts
        graphql-java: [default, ceiling]
    name: native (GraalVM ${{ matrix.graalvm }}, graphql-java ${{ matrix.graphql-java }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@d6eca2595046623d69d636041513c80abf745406 # v1.6.9
        with:
          distribution: 'graalvm'
          java-version: ${{ matrix.graalvm }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: 'gradle'
          native-image-job-reports: 'true'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Run native tests
        run: ./gradlew :test-suite-java:nativeTest :test-suite-kotlin:nativeTest --no-daemon -PgraphqlJavaLeg=${{ matrix.graphql-java }}
        env:
          GRAALVM_QUICK_BUILD: 'true'
          PREDICTIVE_TEST_SELECTION: 'false'
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-test-reports-graalvm${{ matrix.graalvm }}-graphql-java${{ matrix.graphql-java }}
          path: |
            test-suite-*/build/test-results/test-native/TEST-*.xml
            test-suite-*/build/test-results/test-native/
          if-no-files-found: ignore
