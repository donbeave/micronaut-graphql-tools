// Publishes the consumer modules to the GitHub Packages Maven registry of this repository (D-40, milestone previews).
//
// The release workflow passes this file with `-I`, so the tagged source tree is built unchanged: the repository, the POM
// metadata and the safety checks are added to the publications at publish time, and nothing in the build files has to exist
// in the tagged commit. Nothing here runs unless the file is passed on the command line.
//
//   ./gradlew publishAllPublicationsToGitHubPackagesRepository -PprojectVersion=<version> -I .github/gradle/publish-github-packages.init.gradle
//
// Credentials come from the environment (GITHUB_ACTOR and GITHUB_TOKEN); the token needs `packages: write` for this repository.

def registryUrl = 'https://maven.pkg.github.com/donbeave/micronaut-graphql-tools'
def repositoryUrl = 'https://github.com/donbeave/micronaut-graphql-tools'

// The only projects that are published: the library, the annotation processor, the shared binding rules module and the BOM.
// Test suites, benchmarks and anything added later are never published unless they are listed here.
def publishable = ['micronaut-graphql-tools', 'micronaut-graphql-tools-processor', 'micronaut-graphql-tools-binding',
                   'micronaut-graphql-tools-bom'] as Set

// A milestone (1.0.0-M<n>) or a final release (1.0.0). Snapshots and any other string are refused.
def versionPattern = ~/^[0-9]+\.[0-9]+\.[0-9]+(-M[0-9]+)?$/

allprojects {
    if (!(name in publishable)) {
        return
    }
    plugins.withId('maven-publish') {
        afterEvaluate { project ->
            project.publishing {
                repositories {
                    maven {
                        name = 'GitHubPackages'
                        url = registryUrl
                        credentials {
                            username = System.getenv('GITHUB_ACTOR')
                            password = System.getenv('GITHUB_TOKEN')
                        }
                    }
                }
                publications.withType(MavenPublication).configureEach {
                    pom {
                        // The repository is the source of truth for a milestone preview: the module is not an official
                        // Micronaut module until the Foundation contribution (D-09, D-40).
                        description = "${project.description ?: project.findProperty('projectDesc') ?: name.get()} " +
                                '(milestone preview from github.com/donbeave/micronaut-graphql-tools; not an official Micronaut Foundation release)'
                        url = repositoryUrl
                        scm {
                            connection = 'scm:git:https://github.com/donbeave/micronaut-graphql-tools.git'
                            developerConnection = 'scm:git:ssh://git@github.com/donbeave/micronaut-graphql-tools.git'
                            url = repositoryUrl
                        }
                        issueManagement {
                            system = 'GitHub Issues'
                            url = "${repositoryUrl}/issues"
                        }
                    }
                }
            }
        }
    }
}

gradle.taskGraph.whenReady { graph ->
    def publishTasks = graph.allTasks.findAll { it.name.startsWith('publish') && !it.name.contains('MavenLocal') }
    publishTasks.each { task ->
        def version = String.valueOf(task.project.version)
        if (!(version ==~ versionPattern)) {
            throw new GradleException("Refusing to publish ${task.path}: version '${version}' is not a milestone or release " +
                    "version (expected 1.0.0-M<n> or 1.0.0). Pass -PprojectVersion=<version>.")
        }
        if (!(task.project.name in publishable)) {
            throw new GradleException("Refusing to publish ${task.path}: the project is not one of the published modules.")
        }
    }
}
