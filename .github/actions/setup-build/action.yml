name: Set up build tools
description: >-
  Installs the tools in mise.toml with mise (the JDK, and the CLI tools) and, optionally, sets up Gradle with its cache.
  The cache is written from master only: a pull request restores master's cache and never writes one, so a pull request
  cannot put anything into the cache that master or a later run reads.
inputs:
  jdk:
    description: >-
      Temurin line to use (17, 21, 25 or 27), selected with MISE_ENV through mise.jdk<N>.toml. Empty selects the Oracle
      GraalVM of mise.toml, which also provides native-image.
    default: ''
  tools:
    description: Tools to install, as arguments to `mise install`. Empty installs everything that mise.toml and the overlay request.
    default: ''
  gradle:
    description: Set up Gradle (cache and the Gradle home) as well.
    default: 'true'
runs:
  using: composite
  steps:
    - name: Select the JDK
      if: inputs.jdk != ''
      shell: bash
      run: |
        case "$INPUT_JDK" in
          17) mise_env=jdk17 ;;
          21) mise_env=jdk21 ;;
          25) mise_env=jdk25 ;;
          27) mise_env=jdk27 ;;
          *) echo "::error::jdk must be 17, 21, 25 or 27, not '$INPUT_JDK'"; exit 1 ;;
        esac
        echo "MISE_ENV=$mise_env" >> "$GITHUB_ENV"
      env:
        INPUT_JDK: ${{ inputs.jdk }}
    - name: Install tools with mise
      uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
      with:
        install: true
        install_args: ${{ inputs.tools }}
        cache: true
        cache_save: ${{ github.ref == 'refs/heads/master' }}
        cache_key_prefix: mise-${{ inputs.jdk != '' && format('jdk{0}', inputs.jdk) || 'default' }}-${{ inputs.tools }}
    - name: Set up Gradle
      if: inputs.gradle == 'true'
      uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      with:
        cache-read-only: ${{ github.ref != 'refs/heads/master' }}
