# The compile-time budget (#418), in milliseconds. Checked by CompileTimeBudget against the median of the measured builds of the
# gradle-profiler scenarios with the checks on: `<sample>.clean` for the clean build, `<sample>.incremental` for the body edit and
# the schema edit alike. The build time is that of the `classes` task of the sample, a warm daemon, the build cache off.
#
# Each budget is three times the slowest median measured for it (JDK 25.0.5 Oracle GraalVM, Gradle 9.9.1, a laptop whose load
# average was 32 to 38 during the run, 2 warm-ups and 5 builds per scenario), rounded up. The margin covers a shared CI runner,
# which is slower and as noisy as that machine; it is not a target. A budget that fails means a change made the checks
# several times slower, or the build itself did. Measure again before raising one, and quote the numbers in the change.
java-gradle.clean=4000
java-gradle.incremental=7000
kotlin-ksp.clean=8000
kotlin-ksp.incremental=14000
kotlin-kapt.clean=8000
kotlin-kapt.incremental=11000
groovy-gradle.clean=10000
groovy-gradle.incremental=13000
multi-module-gradle.clean=23000
multi-module-gradle.incremental=13000
# The client samples (#664): the same method, measured with the same gradle-profiler scenarios (Gradle 9.9.2, JDK 25 Oracle GraalVM,
# 2 warm-ups and 5 builds). Medians: java-client-gradle clean 626 (checks off 540), slowest incremental 636; groovy-client-gradle clean
# 1588 (off 1543), slowest incremental 1616; kotlin-ksp-client clean 1218 (off 1143), slowest incremental 1060.
java-client-gradle.clean=2000
java-client-gradle.incremental=2000
kotlin-ksp-client.clean=4000
kotlin-ksp-client.incremental=4000
groovy-client-gradle.clean=5000
groovy-client-gradle.incremental=5000
