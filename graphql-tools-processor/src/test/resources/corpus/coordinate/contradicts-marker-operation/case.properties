description=A @GraphQLSchemaCoordinate on a method of a MutationResolver contract that names a field of the query type fails: the marker fixes the operation, so the method is not bound to that field, which the QueryResolver of another class binds. Strict mode is off, so the startup reports the coordinate alone, as the compile-time check does.
tags=lang:all,area:coordinate
config.micronaut.graphql.tools.strict=false
