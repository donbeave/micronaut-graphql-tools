# Bind the address the clients connect to: a wildcard bind can be shadowed by another process listening on the same loopback port.
micronaut.server.host=127.0.0.1
# Micronaut Micrometer is on the test classpath for the observability tests; its executor binder would wrap the executor beans that the execution tests cast.
micronaut.metrics.binders.executor.enabled=false
# Micronaut Security is on the test classpath for the security tests; without an intercept-url-map it would reject every other request. The security scenario turns it on.
micronaut.security.enabled=false
